name: UI verification - Batch 4

on:
  workflow_dispatch:
  # Bootstrap this workflow only from its trusted owner branch. GitHub cannot
  # dispatch a new workflow manually until the file exists on the default branch.
  push:
    branches:
      - codex/issue-76-guest-admission-recovery

permissions:
  contents: read

concurrency:
  group: ui-verification-batch-4
  cancel-in-progress: false

jobs:
  capture:
    name: Capture 19 pinned fixtures
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on:
      - self-hosted
      - Windows
      - X64
      - fotohavn-ui-verification
      - windows-26200
      - dpi-120
      - dotnet-10.0.302
    timeout-minutes: 45

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify pinned runner identity
        shell: pwsh
        run: |
          if ($env:RUNNER_NAME -ne "FotoHAVN-Pinned-UI-QUINJ3875") {
            throw "Unexpected runner '$env:RUNNER_NAME'."
          }
          $sdk = dotnet --version
          if ($sdk -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, found $sdk."
          }

      - name: Validate contracts, tests, and field package
        shell: pwsh
        run: |
          node scripts/build-design-traceability.mjs
          node scripts/validate-design-traceability.mjs
          node --test tests/*.test.mjs
          dotnet test FotoHAVN.slnx -c Release --artifacts-path artifacts/dotnet-tests
          ./scripts/publish-field-test.ps1

      - name: Build verification binaries
        shell: pwsh
        run: |
          dotnet build src/FotoHavn.App/FotoHavn.App.csproj -p:UiVerificationBuild=true -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --artifacts-path artifacts/dotnet-ui
          dotnet build tools/FotoHavn.UiVerificationHost/FotoHavn.UiVerificationHost.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --artifacts-path artifacts/dotnet-host

      - name: Capture Batch 4 evidence
        id: capture
        shell: pwsh
        run: |
          $app = Resolve-Path "artifacts/dotnet-ui/bin/FotoHavn.App/debug_win-x64/FotoHAVN.exe"
          $hostExe = Resolve-Path "artifacts/dotnet-host/bin/FotoHavn.UiVerificationHost/debug_win-x64/FotoHavn.UiVerificationHost.exe"
          $fixtureIds = foreach ($file in Get-ChildItem docs/design-system/traceability/scenarios -Filter *.json) {
            $catalog = Get-Content -Raw -LiteralPath $file.FullName | ConvertFrom-Json
            foreach ($scenario in $catalog.scenarios) {
              if ($scenario.batch -eq 4) {
                @($scenario.visualFixtures) + @($scenario.responsiveViewportCases)
              }
            }
          }
          $fixtureIds = @($fixtureIds | Sort-Object -Unique)
          if ($fixtureIds.Count -ne 19) {
            throw "Expected 19 Batch 4 fixtures, found $($fixtureIds.Count)."
          }
          $fixtureArguments = foreach ($fixtureId in $fixtureIds) { '--fixture'; $fixtureId }

          # Exit 1 means the exact-pixel comparator needs human review. Preserve
          # the artifacts so the semantic and evidence gates can run separately.
          $PSNativeCommandUseErrorActionPreference = $false
          & $hostExe --repository-root . --app $app --output artifacts/ui-verification/batch-4 --completed-through-batch 4 @fixtureArguments
          $hostExit = $LASTEXITCODE
          "host_exit_code=$hostExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($hostExit -notin @(0, 1)) {
            throw "Verification host failed with exit code $hostExit."
          }
          exit 0

      - name: Gate pinned and semantic evidence
        shell: pwsh
        run: |
          ./scripts/summarize-ui-verification.ps1 -RunRoot artifacts/ui-verification/batch-4 -ExpectedResults 19
          Get-Content artifacts/ui-verification/batch-4/summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload targets, actuals, diffs, and semantic evidence
        if: always() && hashFiles('artifacts/ui-verification/batch-4/run.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-verification-batch-4-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/ui-verification/batch-4
            docs/design-system/reference-states/targets/guest-start
            docs/design-system/reference-states/targets/guest-start-unavailable
            tools/FotoHavn.UiVerificationHost/pinned-environment.json
