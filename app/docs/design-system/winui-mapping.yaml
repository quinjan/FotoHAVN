components:
  - id: component.action-button
    control: Microsoft.UI.Xaml.Controls.Button
    styles: [FotoHavnActionButtonPrimaryStyle, FotoHavnActionButtonSecondaryStyle, FotoHavnActionButtonTertiaryStyle, FotoHavnActionButtonDestructiveStyle, FotoHavnActionButtonGuestProminentStyle]
    properties: [Content, IsEnabled, IsTabStop, AutomationProperties.Name]
    visualStateGroups: { CommonStates: [Normal, PointerOver, Pressed, Disabled], FocusStates: [Focused, PointerFocused, Unfocused], ActionStates: [Idle, Busy] }
    accessibility: [native-button-pattern, label-in-accessible-name, busy-announcement, 48px-minimum, 64px-guest-prominent]
    verification: [DS-BUTTON-KEYBOARD, DS-BUTTON-TOUCH, DS-BUTTON-BUSY, DS-FOCUS]
  - id: component.icon-action
    control: Microsoft.UI.Xaml.Controls.Button
    styles: [FotoHavnIconActionStyle, FotoHavnIconActionDestructiveStyle]
    properties: [Content, IsEnabled, AutomationProperties.Name, ToolTipService.ToolTip]
    visualStateGroups: { CommonStates: [Normal, PointerOver, Pressed, Disabled], FocusStates: [Focused, PointerFocused, Unfocused] }
    accessibility: [mandatory-name, matching-tooltip, 48x48-target]
    verification: [DS-ICON-NAME, DS-ICON-TOUCH, DS-FOCUS]
  - id: component.text-field
    control: Microsoft.UI.Xaml.Controls.TextBox
    styles: [FotoHavnTextFieldStyle]
    properties: [Header, Text, PlaceholderText, IsEnabled, AutomationProperties.Name, AutomationProperties.HelpText]
    visualStateGroups: { CommonStates: [Normal, PointerOver, Focused, Disabled], ValidationStates: [Valid, Invalid, Unavailable] }
    accessibility: [label-association, invalid-status, first-invalid-focus]
    verification: [DS-FIELD-KEYBOARD, DS-FIELD-ERROR, DS-NARRATOR]
  - id: component.select-field
    control: Microsoft.UI.Xaml.Controls.ComboBox
    styles: [FotoHavnSelectFieldStyle]
    properties: [Header, ItemsSource, SelectedItem, PlaceholderText, IsEnabled, AutomationProperties.Name, AutomationProperties.HelpText]
    visualStateGroups: { CommonStates: [Normal, PointerOver, Focused, Disabled], ValidationStates: [Valid, Invalid, Unavailable] }
    accessibility: [selection-pattern, label-association, invalid-status]
    verification: [DS-SELECT-KEYBOARD, DS-SELECT-ERROR, DS-NARRATOR]
  - id: component.read-only-value
    control: Microsoft.UI.Xaml.Controls.TextBlock
    styles: [FotoHavnReadOnlyValueStyle]
    properties: [Text, AutomationProperties.Name]
    visualStateGroups: {}
    accessibility: [label-value-relationship, no-false-editability]
    verification: [DS-READONLY-NARRATOR, DS-REFLOW]
  - id: component.inline-status
    control: FotoHavn.App.Controls.InlineStatus
    styles: [FotoHavnInlineStatusStyle]
    properties: [Severity, Message, AnnouncementPriority]
    visualStateGroups: { SeverityStates: [Neutral, Info, Success, Warning, Danger] }
    accessibility: [text-plus-noncolor, deduplicated-live-region]
    verification: [DS-STATUS-CONTRAST, DS-STATUS-ANNOUNCE]
  - id: component.status-callout
    control: FotoHavn.App.Controls.StatusCallout
    styles: [FotoHavnStatusCalloutStyle]
    properties: [Severity, Title, Message, Action]
    visualStateGroups: { SeverityStates: [Neutral, Info, Success, Warning, Danger] }
    accessibility: [region-association, actionable-error-copy]
    verification: [DS-CALLOUT-CONTRAST, DS-CALLOUT-NARRATOR, DS-REFLOW]
  - id: component.progress-indicator
    control: Microsoft.UI.Xaml.Controls.ProgressRing | Microsoft.UI.Xaml.Controls.ProgressBar
    styles: [FotoHavnProgressRingStyle, FotoHavnProgressBarStyle]
    properties: [IsIndeterminate, IsActive, Minimum, Maximum, Value, AutomationProperties.Name]
    visualStateGroups: {}
    accessibility: [range-value-when-determinate, no-frame-announcements]
    verification: [DS-PROGRESS-NARRATOR, DS-REDUCED-MOTION]
  - id: component.toast
    control: FotoHavn.App.Controls.InAppToast
    styles: [FotoHavnToastStyle]
    properties: [Message, IsOpen, DismissCommand]
    visualStateGroups: { DisplayStates: [Closed, Open] }
    accessibility: [polite-announcement, no-focus-steal, dismissible]
    verification: [DS-TOAST-NARRATOR, DS-TOAST-FOCUS, DS-REFLOW]
  - id: component.modal-dialog
    control: Microsoft.UI.Xaml.Controls.ContentDialog
    styles: [FotoHavnModalDialogStyle]
    properties: [Title, Content, PrimaryButtonText, SecondaryButtonText, IsPrimaryButtonEnabled, IsSecondaryButtonEnabled, XamlRoot]
    visualStateGroups: { DialogStates: [Idle, Busy, Failed], LayoutStates: [Standard, Stress] }
    accessibility: [dialog-pattern, level1-heading, initial-safe-focus, focus-containment, inert-background, escape-idle-only, focus-restoration]
    verification: [DS-MODAL-FOCUS, DS-MODAL-ESCAPE, DS-MODAL-BUSY, DS-MODAL-NARRATOR, DS-REFLOW]
  - id: component.app-header
    control: FotoHavn.App.Controls.AppHeader
    styles: [FotoHavnAppHeaderStyle]
    properties: [Context, EventName, TrailingContent]
    visualStateGroups: { ContextStates: [Operator, GuestCycle], LayoutStates: [Standard, Compact, Stress] }
    accessibility: [single-product-name, decorative-mark-hidden]
    verification: [DS-HEADER-NARRATOR, DS-HEADER-REFLOW]
  - id: component.event-card
    control: FotoHavn.App.Controls.EventCard
    styles: [FotoHavnEventCardStyle]
    properties: [EventName, CompactEventId, SavedMetadata, Readiness, StartCommand, EditCommand, DeleteCommand]
    visualStateGroups: { CommonStates: [Ready, PointerOver, Focused, Unavailable, Busy, DeletionIncomplete], LayoutStates: [Standard, Stress] }
    accessibility: [group-semantics, disambiguated-actions, complete-name, compact-id-announcement]
    verification: [DS-EVENTCARD-KEYBOARD, DS-EVENTCARD-TOUCH, DS-EVENTCARD-NARRATOR, DS-EVENTCARD-REFLOW]
  - id: component.setup-field-group
    control: FotoHavn.App.Controls.SetupFieldGroup
    styles: [FotoHavnSetupFieldGroupStyle]
    properties: [Label, FieldContent, HelperContent, Status, IsDirty]
    visualStateGroups: { FieldStates: [Clean, Dirty, Checking, Ready, Invalid, Unavailable] }
    accessibility: [label-field-status-association, asynchronous-no-focus-steal]
    verification: [DS-SETUP-VALIDATION, DS-SETUP-NARRATOR, DS-SETUP-REFLOW]
  - id: component.camera-viewport
    control: FotoHavn.App.Controls.CameraViewport
    styles: [FotoHavnCameraViewportStyle]
    properties: [Mode, Source, IsMirrored, Status, ShowCaptureGuide, OverlayContent]
    visualStateGroups: { CameraStates: [Connecting, Live, Countdown, Flash, CaptureSaved, Unavailable], LayoutStates: [Standard, Compact, Stress] }
    accessibility: [functional-image-name, state-separate, decorative-overlays-hidden]
    verification: [DS-CAMERA-ASPECT, DS-CAMERA-NARRATOR, DS-CAMERA-REFLOW]
  - id: component.capture-progress
    control: FotoHavn.App.Controls.CaptureProgress
    styles: [FotoHavnCaptureProgressStyle]
    properties: [ActiveCapture, Phase]
    visualStateGroups: { CaptureStates: [NotStarted, Capture1, Capture2, Capture3, Capture4, Complete] }
    accessibility: [single-progress-concept, shape-and-stroke-meaning]
    verification: [DS-CAPTURE-PROGRESS-NARRATOR, DS-CAPTURE-PROGRESS-CONTRAST]
  - id: component.operator-assistance
    control: FotoHavn.App.Controls.OperatorAssistance
    styles: [FotoHavnOperatorAssistanceStyle]
    properties: [Cause, Stage, DurableCaptureCount, Recovery, ActionState]
    visualStateGroups: { ActionStates: [Idle, Retrying, Recovered, RetryFailed], LayoutStates: [Standard, Compact, Stress] }
    accessibility: [assertive-activation, preserved-progress, bounded-actionable-copy]
    verification: [DS-ASSISTANCE-NARRATOR, DS-ASSISTANCE-KEYBOARD, DS-ASSISTANCE-REFLOW]
  - id: component.photo-strip-result
    control: FotoHavn.App.Controls.PhotoStripResult
    styles: [FotoHavnPhotoStripResultStyle]
    properties: [ImageSource, RemainingSeconds, ReturnProgress, Title, Message]
    visualStateGroups: { ResultStates: [Preparing, Visible, Returning, Failed], LayoutStates: [Standard, Compact, Stress] }
    accessibility: [photo-strip-preview-name, milestone-announcements, automatic-return]
    verification: [DS-STRIP-ASPECT, DS-STRIP-NARRATOR, DS-STRIP-REFLOW, DS-REDUCED-MOTION]

verificationSeams:
  visual:
    matrix: docs/design-system/reference-states/matrix.yaml
    references: [1280x720, 1024x768, 1024x576, 853x480, 640x360]
    assertions: [no-clipping, no-overlap, no-horizontal-scroll, no-distorted-media, no-guest-vertical-scroll]
  accessibility:
    assertions: [keyboard-complete, visible-focus, narrator-names-states-announcements, 48px-targets, 64px-guest-actions, measured-contrast, high-contrast, reduced-motion]
  behavior:
    project: tests/FotoHavn.AcceptanceTests/FotoHavn.AcceptanceTests.csproj
    assertions: [state-destinations, durable-capture-progress, retry-preserves-context, automatic-photo-strip-return]
  windowsIntegration:
    project: tests/FotoHavn.WindowsIntegrationTests/FotoHavn.WindowsIntegrationTests.csproj
    assertions: [camera-status-seams, storage-status-seams, media-aspect-seams]
