name: fotohavn

services:
  web:
    image: ${FOTOHAVN_IMAGE:?FOTOHAVN_IMAGE must be an immutable GHCR digest}
    container_name: fotohavn-web
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - next-cache:/app/.next/cache
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: photobiz_default

volumes:
  next-cache:
    name: fotohavn-next-cache
